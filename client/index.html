<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>openHR - Sistem HR & Penggajian UKM Indonesia</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <link rel="manifest" href="/api/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HR" />
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="root">
      <div
        style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif"
      >
        <div
          style="width:56px;height:56px;border-radius:16px;background:#0f172a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;letter-spacing:0.04em;box-shadow:0 10px 25px -10px rgba(15,23,42,.55)"
        >
          HR
        </div>
        <div style="width:150px;height:4px;border-radius:999px;background:#e2e8f0;overflow:hidden">
          <div
            style="width:45%;height:100%;border-radius:999px;background:#2563eb;animation:boot-bar 1.1s ease-in-out infinite"
          ></div>
        </div>
      </div>
    </div>
    <style>
      @keyframes boot-bar {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(330%); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
